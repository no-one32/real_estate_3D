<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="preload" href="/models/Interactive.glb" as="fetch" crossorigin="anonymous">
<!-- villas: the same look as real-estate (Inter for numbers / Latin, Noto Sans Arabic for Arabic) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="./villa.css?v=3">
<title>المشروع ثلاثي الأبعاد — النسخة الأخيرة</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1220; }
  body {
    font-family: "Segoe UI", "Tahoma", system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #loader {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px;
    background:
      radial-gradient(1200px 700px at 50% 10%, #1d3350 0%, #101a2b 45%, #080d16 100%);
    transition: opacity .8s ease, visibility .8s ease;
  }
  body.ready #loader { opacity: 0; visibility: hidden; pointer-events: none; }

  .brand { text-align: center; }
  .brand h1 { margin: 0 0 6px; font-size: clamp(20px, 3vw, 30px); font-weight: 700; letter-spacing: .2px; color: #eef5ff; }
  .brand p { margin: 0; font-size: 13px; color: #8aa3c0; letter-spacing: .4px; }

  .spinner {
    width: 58px; height: 58px; border-radius: 50%;
    border: 2px solid rgba(154, 190, 230, .18);
    border-top-color: #7cc4ff;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 30px rgba(80, 160, 255, .18) inset, 0 0 24px rgba(80, 160, 255, .12);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .progress {
    width: min(360px, 74vw); height: 6px; border-radius: 99px;
    background: rgba(140, 180, 225, .16); overflow: hidden;
  }
  #bar {
    width: 0%; height: 100%; border-radius: inherit;
    background: linear-gradient(90deg, #4aa8ff, #8ce0ff);
    transition: width .25s ease;
    box-shadow: 0 0 14px rgba(90, 180, 255, .7);
  }
  #pct { font-size: 12px; color: #9db6d2; font-variant-numeric: tabular-nums; letter-spacing: .5px; }

  .fatal { display: none; max-width: 460px; text-align: center; color: #ffb4b4; font-size: 14px; line-height: 1.8; }
  body.error .fatal { display: block; }
  body.error .spinner, body.error .progress, body.error #pct { display: none; }

  #ui {
    position: fixed; top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left));
    z-index: 10; display: flex; gap: 10px;
    opacity: 0; transform: translateY(-6px); transition: opacity .5s ease .2s, transform .5s ease .2s;
  }
  body.ready #ui { opacity: 1; transform: none; }
  #ui button {
    width: 44px; height: 44px; border-radius: 13px;
    border: 1px solid rgba(160, 200, 240, .22);
    background: rgba(14, 26, 43, .55);
    color: #e8f2ff; font-size: 19px; line-height: 1;
    display: grid; place-items: center; cursor: pointer;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    transition: background .2s ease, transform .15s ease;
  }
  #ui button:hover { background: rgba(32, 58, 92, .7); }
  #ui button:active { transform: scale(.94); }
  /* eye (villa colours): lit when on, like real-estate */
  #ui #eyeBtn.on { background: #3b7dd8; border-color: #3b7dd8; color: #fff; }
  /* villas: layers over the 3D view */
  #villa-hud { position: fixed; inset: 0; z-index: 9; pointer-events: none; }
  #villa-hud .tip-enter { pointer-events: auto; cursor: pointer; }
  #villa-tour { position: fixed; inset: 0; z-index: 40; display: none; }
  #villa-tour.open { display: block; }
  :root { --font-inter: Inter, "Noto Sans Arabic"; }

  #hint {
    position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(8px);
    z-index: 10; padding: 9px 16px; border-radius: 99px;
    background: rgba(10, 20, 34, .55);
    border: 1px solid rgba(160, 200, 240, .16);
    color: #cfe1f4; font-size: 12.5px; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    opacity: 0; transition: opacity .6s ease .5s, transform .6s ease .5s;
    pointer-events: none;
  }
  body.ready #hint { opacity: .95; transform: translateX(-50%) translateY(0); }
  @media (max-width: 520px) {
    #hint { font-size: 11px; padding: 8px 12px; }
  }

  /* ---- sun / time of day ---- */
  #sunpanel {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 14px;
    border: 1px solid rgba(160, 200, 240, .22);
    background: rgba(14, 26, 43, .55);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .28);
    opacity: 0; transform: translateY(-6px);
    transition: opacity .5s ease .2s, transform .5s ease .2s;
  }
  body.ready #sunpanel { opacity: 1; transform: none; }

  #sunicon { font-size: 17px; line-height: 1; color: #ffd27a; }

  #sunRange {
    -webkit-appearance: none; appearance: none;
    width: 150px; height: 4px; border-radius: 99px;
    background: linear-gradient(90deg, #ff7a33, #ffd07a 35%, #bfe0ff 55%, #ffd07a 75%, #ff7a33);
    outline: none; cursor: pointer;
  }
  #sunRange::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff7e6; border: 2px solid #ffb347;
    box-shadow: 0 0 10px rgba(255, 180, 70, .85);
    cursor: grab;
  }
  #sunRange::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff7e6; border: 2px solid #ffb347;
    box-shadow: 0 0 10px rgba(255, 180, 70, .85);
    cursor: grab;
  }
  #sunTime {
    min-width: 42px; text-align: center;
    font-size: 12px; color: #cfe1f4;
    font-variant-numeric: tabular-nums; letter-spacing: .3px;
  }

  @media (max-width: 520px) {
    #sunpanel { padding: 8px 10px; gap: 7px; border-radius: 12px; }
    #sunRange { width: 92px; }
    #sunTime { font-size: 11px; min-width: 38px; }
    #sunicon { font-size: 15px; }
  }

  /* ---- hotspots (pins over the places) ---- */
  #hotspots { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .6s ease .4s; }
  body.ready #hotspots { opacity: 1; }
  .hs {
    position: absolute; left: 0; top: 0; padding: 0; border: 0; background: none;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: auto; cursor: pointer; will-change: transform;
    font: inherit; color: #12243d;
    /* the stem's foot sits on the place */
    margin: 0; translate: -50% -100%;
  }
  .hs-pin {
    display: flex; align-items: center; gap: 0;
    padding: 4px; border-radius: 99px;
    background: rgba(255, 255, 255, .95); color: #12243d;
    box-shadow: 0 6px 18px rgba(8, 20, 40, .3);
    font-size: 13.5px; font-weight: 600; white-space: nowrap;
    transition: background .2s ease, color .2s ease, gap .25s ease, padding .25s ease;
  }
  .hs-pin svg { flex: none; width: 30px; height: 30px; padding: 6px; border-radius: 50%; background: #3b7dd8; color: #fff; transition: background .2s ease, color .2s ease; }
  .hs-villa .hs-pin svg { background: #3dba67; }
  .hs-far .hs-pin svg { background: #8a6bd6; }
  /* the name is hidden: only the round icon shows, the mouse over it widens it */
  .hs-pin b { max-width: 0; overflow: hidden; opacity: 0; transition: max-width .3s ease, opacity .2s ease; }
  .hs:hover .hs-pin, .hs:focus-visible .hs-pin, .hs.on .hs-pin { gap: 8px; padding: 4px 14px 4px 4px; background: #3b7dd8; color: #fff; }
  .hs:hover .hs-pin b, .hs:focus-visible .hs-pin b, .hs.on .hs-pin b { max-width: 240px; opacity: 1; }
  .hs:hover .hs-pin svg, .hs:focus-visible .hs-pin svg, .hs.on .hs-pin svg { background: #fff; color: #3b7dd8; }
  .hs:hover, .hs.on { z-index: 2000 !important; }
  /* behind the houses (seen from the street): fade out and let clicks pass through to the 3D view */
  .hs { transition: opacity .25s ease; }
  .hs.hs-hide { opacity: 0; pointer-events: none; }
  /* solid stem down to a dot sitting exactly on the place, so the pin looks planted (not floating) */
  .hs-stem { position: relative; width: 2px; height: 22px; background: #fff; box-shadow: 0 0 2px rgba(8, 20, 40, .45); }
  .hs-stem::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 8px; height: 8px; transform: translate(-50%, 50%); border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(59,125,216,.45), 0 1px 3px rgba(8, 20, 40, .4); }
  @media (max-width: 520px) {
    .hs-pin svg { width: 26px; height: 26px; padding: 5px; }
    .hs-pin { font-size: 12px; }
    .hs-stem { height: 16px; }
  }

  /* ---- info panel of the clicked place (left side) ---- */
  #hcard {
    position: fixed; z-index: 12;
    left: max(16px, env(safe-area-inset-left));
    top: calc(max(14px, env(safe-area-inset-top)) + 58px);
    width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 100px); overflow: auto;
    padding: 0; border-radius: 18px;
    background: rgba(255, 255, 255, .97); color: #12243d;
    box-shadow: 0 18px 48px rgba(8, 20, 40, .35);
    opacity: 0; transform: translateX(-24px); pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
  }
  #hcard.open { opacity: 1; transform: none; pointer-events: auto; }
  .hc-img { display: block; width: 100%; aspect-ratio: 2 / 1; object-fit: cover; border-radius: 18px 18px 0 0; background: #e7eef6; }
  .hc-body { padding: 16px 20px 18px; }
  #hcard.has-img .hc-x { background: rgba(255, 255, 255, .92); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
  #hcard.has-img .hc-head { margin-left: 0; }
  .hc-facts { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .hc-facts li { display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 99px; background: #eef4fb; color: #22426d; font-size: 13px; font-weight: 600; }
  .hc-facts li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3b7dd8; }
  .hc-x { position: absolute; z-index: 1; top: 12px; left: 12px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: #eef3f9; color: #12243d; font-size: 21px; line-height: 1; cursor: pointer; }
  .hc-x:hover { background: #dfe9f5; }
  .hc-head { display: flex; align-items: center; gap: 12px; margin: 0 0 12px 40px; }
  .hc-ico { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: #e7f0fb; color: #3b7dd8; flex: none; }
  #hcard h2 { margin: 0; font-size: 20px; line-height: 1.4; }
  #hcard p { margin: 0; font-size: 15px; line-height: 1.9; color: #3f4f66; }
  #hcard p + p { margin-top: 10px; }
  /* phones (upright or sideways): a small panel at the bottom that leaves the view free */
  @media (max-width: 520px), (max-height: 500px) and (pointer: coarse) {
    #hcard {
      top: auto; bottom: max(10px, env(safe-area-inset-bottom));
      left: max(10px, env(safe-area-inset-left)); width: min(360px, calc(100vw - 20px));
      transform: translateY(20px); max-height: 34vh; border-radius: 14px;
    }
    .hc-img { aspect-ratio: 4 / 1; border-radius: 14px 14px 0 0; }
    .hc-body { padding: 8px 12px 10px; }
    .hc-head { gap: 8px; margin: 0 0 6px 32px; }
    .hc-ico { width: 30px; height: 30px; border-radius: 9px; }
    .hc-ico svg { width: 17px; height: 17px; }
    #hcard h2 { font-size: 15px; }
    #hcard p { font-size: 12px; line-height: 1.6; }
    #hcard p + p { margin-top: 6px; }
    .hc-facts { margin-top: 8px; gap: 5px; }
    .hc-facts li { font-size: 10.5px; padding: 3px 8px; gap: 4px; }
    .hc-x { top: 8px; left: 8px; width: 26px; height: 26px; font-size: 17px; }
  }
  @media (max-height: 500px) and (pointer: coarse) {
    .hc-img { display: none; } /* phone sideways: no room for the picture */
  }

  /* ---- places list ---- */
  #places {
    position: fixed; z-index: 11; top: calc(max(14px, env(safe-area-inset-top)) + 54px); left: max(14px, env(safe-area-inset-left));
    width: 230px; max-height: calc(100vh - 140px); overflow: auto; padding: 10px; border-radius: 16px;
    background: rgba(255, 255, 255, .96); box-shadow: 0 14px 36px rgba(8, 20, 40, .3);
    display: none;
  }
  #places.open { display: block; }
  #places h3 { margin: 4px 8px 8px; font-size: 14px; color: #12243d; }
  #places button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 10px; border: 0; border-radius: 10px; background: none; color: #12243d; font: inherit; font-size: 13.5px; text-align: right; cursor: pointer; }
  #places button:hover { background: #eef4fb; }
  #places button svg { color: #3b7dd8; flex: none; }

  /* ---- intro video (first visit only), skip button like YouTube ---- */
  #intro { position: fixed; inset: 0; z-index: 100; background: #000; transition: opacity .6s ease; }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro video { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* skip: bottom right; sound: bottom left (like YouTube's controls); thin progress line at the very bottom */
  #introSkip, #introSound {
    position: absolute; bottom: max(28px, calc(env(safe-area-inset-bottom) + 20px));
    display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff;
    border: 1px solid rgba(255, 255, 255, .28); background: rgba(15, 15, 15, .55);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
    transition: background .2s ease, color .2s ease, transform .15s ease;
  }
  #introSkip:active, #introSound:active { transform: scale(.95); }
  #introSkip {
    right: max(24px, env(safe-area-inset-right));
    gap: 10px; height: 48px; padding: 0 20px 0 24px; border-radius: 99px;
    font: 600 17px "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
    animation: introIn .5s ease 1s both;
  }
  #introSkip:hover { background: #fff; color: #111; }
  #introSkip svg { width: 20px; height: 20px; transform: scaleX(-1); }
  #introSound {
    left: max(24px, env(safe-area-inset-left));
    width: 48px; height: 48px; padding: 0; border-radius: 50%;
    animation: introIn .5s ease 1s both;
  }
  #introSound:hover { background: rgba(255, 255, 255, .22); }
  #introSound svg { width: 24px; height: 24px; }
  #introSound .on { display: none; }
  #introSound.unmuted .on { display: block; }
  #introSound.unmuted .off { display: none; }
  #introBar { direction: ltr; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .2); }
  #introBar i { display: block; height: 100%; width: 0; background: #ff2d2d; }
  @keyframes introIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 520px) {
    #introSkip { height: 42px; font-size: 15px; padding: 0 16px 0 20px; right: max(16px, env(safe-area-inset-right)); }
    #introSound { width: 42px; height: 42px; left: max(16px, env(safe-area-inset-left)); }
    #introSkip, #introSound { bottom: max(20px, calc(env(safe-area-inset-bottom) + 14px)); }
  }

  #editToast { position: fixed; z-index: 30; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: #12243d; color: #fff; font: 13px monospace; direction: ltr; display: none; }
  #editToast.show { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<!-- intro video: shown on the first visit only (the 3D model loads behind it) -->
<div id="intro" hidden>
  <video id="introVideo" playsinline preload="auto"></video>
  <button id="introSound" type="button" aria-label="الصوت">
    <svg class="off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16 9.4l1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></svg>
    <svg class="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3z"/><path d="M16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/><path d="M14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
  </button>
  <button id="introSkip" type="button">تخطي
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5l10 7-10 7z"/><rect x="17" y="5" width="2.5" height="14"/></svg>
  </button>
  <div id="introBar"><i></i></div>
</div>
<script>
(function () {
  var KEY = 'introSeen';
  try { if (localStorage.getItem(KEY)) return; } catch (e) {}
  var box = document.getElementById('intro'), v = document.getElementById('introVideo');
  var done = false;
  function close() {
    if (done) return; done = true;
    try { localStorage.setItem(KEY, '1'); } catch (e) {}
    v.pause();
    box.classList.add('out');
    setTimeout(function () { box.remove(); }, 700);
  }
  box.hidden = false;
  v.src = './intro.mp4';
  v.addEventListener('ended', close);
  v.addEventListener('error', close);
  document.getElementById('introSkip').addEventListener('click', close);
  var snd = document.getElementById('introSound'), bar = document.querySelector('#introBar i');
  function showSound() { snd.classList.toggle('unmuted', !v.muted); }
  function toggleSound() { v.muted = !v.muted; showSound(); if (v.paused) v.play().catch(function () {}); }
  snd.addEventListener('click', function (e) { e.stopPropagation(); toggleSound(); });
  v.addEventListener('click', function () { if (v.muted) toggleSound(); });
  v.addEventListener('timeupdate', function () { if (v.duration) bar.style.width = (v.currentTime / v.duration * 100) + '%'; });
  // try with sound first; browsers usually block that on a first visit, then play muted (the icon shows muted)
  v.muted = false;
  v.play().then(showSound).catch(function () {
    v.muted = true; showSound();
    v.play().catch(close); // even muted refused: go straight to the 3D view
  });
})();
</script>

<div id="loader">
  <div class="spinner"></div>
  <div class="brand">
    <h1>المشروع ثلاثي الأبعاد</h1>
    <p>جارٍ تحميل النسخة الأخيرة</p>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div id="pct">0%</div>
  <div class="fatal" id="fatal">تعذّر تحميل النموذج. تحقّق من اتصال الإنترنت أو من دعم WebGL في المتصفح.</div>
</div>

<div id="ui">
  <button id="reset" title="إعادة ضبط الكاميرا" aria-label="إعادة ضبط الكاميرا">⟲</button>
  <button id="fs" title="ملء الشاشة" aria-label="ملء الشاشة">⛶</button>
  <button id="placesBtn" title="الأماكن" aria-label="الأماكن">☰</button>
  <!-- eye: show / hide the colour of every villa (green available, orange reserved, red sold) -->
  <button id="eyeBtn" title="Show units" aria-label="إظهار الوحدات" aria-pressed="false"></button>
</div>

<!-- villas (villas.js / villa-tour.js): hover card, "click again to enter" card, inside the villa -->
<div id="villa-hud" dir="ltr"></div>
<div id="villa-tour" dir="ltr"></div>

<div id="hotspots"></div>
<nav id="places" aria-label="الأماكن"></nav>
<div id="hcard" role="dialog" aria-live="polite"></div>
<div id="editToast"></div>
</div>

<div id="hint">اضغط على أي مكان للاقتراب منه • اسحب للدوران • إصبعان للتكبير</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.1/build/index.module.js"
  }
}
</script>
<script type="module" src="./app.js?v=51"></script>
</body>
</html>
